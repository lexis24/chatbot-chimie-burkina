<!DOCTYPE html>
<html lang="fr" data-theme="chatmaths-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prof Amira - Assistant Mathématiques</title>
    <meta name="description" content="Assistant IA de mathématiques pour les élèves du Burkina Faso, de la 6ème à la Terminale, propulsé par Claude et un système RAG." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230d9488'/><path d='M17 7H7l5 5-5 5h10' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>"
    />
    <!-- Icône d'écran d'accueil (PWA) : sans manifeste ni apple-touch-icon, iOS/Android génèrent
         une icône de repli à partir de la première lettre du <title> ("P" de "Prof Amira") plutôt
         que le logo de l'app — voir manifest.webmanifest (icônes any + maskable) et
         public/icons/, générées à partir du même symbole Σ que le bandeau de l'app (Header.jsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prof Amira" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
</html>
